<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <title>지출 관리 - Parcel Beside U</title>
  <link rel="stylesheet" href="styles.css" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    .exp-container {
      background: var(--bg-main); border: 1px solid var(--divider);
      border-radius: 8px; padding: 28px; margin-top: 24px;
    }
    .hidden { display: none; }

    /* --- 로그인 --- */
    .login-field { margin-bottom: 20px; }
    .login-field label { display: block; font-weight: 600; margin-bottom: 8px; font-size: 16px; }
    .login-field input { width: 100%; padding: 12px; border: 1px solid var(--divider); border-radius: 4px; font-family: inherit; font-size: 16px; }

    /* --- 상단 --- */
    .exp-toolbar { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin-bottom: 20px; }
    .month-nav { display: flex; align-items: center; gap: 8px; }
    .month-nav button { border: 1px solid var(--divider); background: #fff; border-radius: 6px; width: 32px; height: 32px; cursor: pointer; font-size: 15px; color: var(--text-main); }
    .month-nav button:hover { background: var(--bg-hover); }
    .month-label { font-size: 17px; font-weight: 700; min-width: 108px; text-align: center; }
    .btn-primary { background: #111827; color: #fff; border: none; padding: 10px 18px; border-radius: 6px; font-size: 15px; font-weight: 600; cursor: pointer; font-family: inherit; }
    .btn-primary:hover { background: #1f2937; }
    .btn-primary:disabled { opacity: 0.5; cursor: default; }
    .btn-ghost { background: #fff; border: 1px solid var(--divider); padding: 10px 18px; border-radius: 6px; font-size: 15px; cursor: pointer; font-family: inherit; color: var(--text-main); }
    .btn-sm { padding: 6px 13px; font-size: 13px; }

    .hero { border: 1px solid var(--divider); border-radius: 8px; padding: 20px 22px; margin-bottom: 22px; }
    .hero-label { font-size: 14px; color: var(--text-gray); }
    .hero-num { font-size: 38px; font-weight: 700; letter-spacing: -0.5px; margin: 2px 0 6px; font-variant-numeric: tabular-nums; }
    .hero-delta { font-size: 14px; }
    .delta-up { color: #b91c1c; }
    .delta-down { color: #15803d; }
    .delta-flat { color: var(--text-gray); }

    /* --- 집계 막대 --- */
    .sec-title { font-weight: 600; font-size: 14px; margin: 24px 0 12px; }
    .two-col { display: grid; grid-template-columns: 1fr 1fr; gap: 26px; }
    @media (max-width: 700px) { .two-col { grid-template-columns: 1fr; gap: 6px; } }
    .cat-row { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; font-size: 14px; }
    .cat-name { width: 84px; flex-shrink: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .cat-track { flex: 1; background: #f3f4f6; border-radius: 4px; height: 14px; overflow: hidden; }
    .cat-fill { height: 100%; border-radius: 4px; display: block; }
    .cat-amt { min-width: 88px; text-align: right; font-variant-numeric: tabular-nums; font-size: 13.5px; }

    /* --- 추이 --- */
    .trend { display: flex; align-items: flex-end; gap: 10px; height: 110px; }
    .trend-col { flex: 1; display: flex; flex-direction: column; justify-content: flex-end; height: 100%; }
    .trend-bar { width: 100%; background: #3b82f6; border-radius: 4px 4px 0 0; min-height: 3px; }
    .trend-bar.current { background: #1d4ed8; }
    .trend-bar.empty { background: #e5e7eb; }
    .trend-x { display: flex; gap: 10px; margin-top: 8px; }
    .trend-x span { flex: 1; text-align: center; font-size: 12px; color: var(--text-gray); }

    /* --- 정기결제 --- */
    .recur-alert { background: #fffbeb; border: 1px solid #fcd34d; border-radius: 8px; padding: 14px 16px; margin-bottom: 12px; display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
    .recur-alert-text { flex: 1; font-size: 14px; min-width: 200px; }
    .recur-alert-text b { display: block; margin-bottom: 2px; }
    .recur-item { border: 1px solid var(--divider); border-radius: 8px; padding: 13px 16px; margin-bottom: 8px; display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
    .recur-item.off { opacity: 0.55; }
    .recur-day { background: #f3f4f6; border-radius: 6px; padding: 5px 9px; font-size: 12.5px; font-weight: 700; white-space: nowrap; }
    .recur-name { font-weight: 600; font-size: 15px; }
    .recur-meta { font-size: 12.5px; color: var(--text-gray); margin-top: 1px; }
    .recur-amt { margin-left: auto; font-weight: 700; font-variant-numeric: tabular-nums; white-space: nowrap; }
    .recur-state { font-size: 12.5px; font-weight: 600; white-space: nowrap; }
    .state-done { color: #15803d; }
    .state-todo { color: #b45309; }
    .state-off { color: var(--text-gray); }

    /* --- 목록 --- */
    .filter-chips { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 14px; }
    .chip { border: 1px solid var(--divider); background: #fff; border-radius: 14px; padding: 5px 13px; font-size: 13px; cursor: pointer; font-family: inherit; color: var(--text-main); }
    .chip:hover { background: var(--bg-hover); }
    .chip.active { background: #111827; color: #fff; border-color: #111827; }

    .exp-item { border: 1px solid var(--divider); border-radius: 8px; padding: 13px 14px 13px 16px; margin-bottom: 8px; }
    .exp-head { display: flex; align-items: center; gap: 9px; }
    .exp-title { font-weight: 600; font-size: 15px; flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .badge { font-size: 11.5px; padding: 2px 8px; border-radius: 4px; font-weight: 600; white-space: nowrap; }
    .b-ad { background: #dbeafe; color: #1e40af; }
    .b-print { background: #ede9fe; color: #5b21b6; }
    .b-office { background: #fef3c7; color: #92400e; }
    .b-fixed { background: #d1fae5; color: #065f46; }
    .b-etc { background: #f3f4f6; color: #374151; }
    .recur-mark { font-size: 13px; cursor: default; }
    .exp-amt { text-align: right; white-space: nowrap; }
    .exp-amt b { font-weight: 700; font-size: 15.5px; font-variant-numeric: tabular-nums; }
    .exp-amt small { display: block; font-size: 11.5px; color: var(--text-gray); font-variant-numeric: tabular-nums; margin-top: -2px; }
    .more-btn { background: none; border: none; color: var(--text-gray); cursor: pointer; font-size: 16px; line-height: 1; padding: 2px; border-radius: 4px; width: 22px; flex-shrink: 0; font-family: inherit; }
    .more-btn:hover { background: var(--bg-hover); color: var(--text-main); }
    .exp-meta { font-size: 12.5px; color: var(--text-gray); margin-top: 5px; }
    .exp-row2 { display: flex; align-items: center; gap: 12px; margin-top: 6px; flex-wrap: wrap; }
    .link-btn { background: none; border: none; color: #2563eb; cursor: pointer; font-size: 12.5px; padding: 0; font-family: inherit; }
    .link-btn.danger { color: #dc2626; }
    .row-actions { margin-left: auto; display: flex; gap: 12px; }
    .ad-detail { margin-top: 10px; padding: 12px 14px; background: #f8fafc; border-radius: 6px; border-left: 3px solid #3b82f6; }
    .ad-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 10px 18px; font-size: 13.5px; }
    .ad-k { color: var(--text-gray); font-size: 12.5px; }
    .ad-v { font-weight: 600; margin-top: 1px; }
    .ad-note { margin-top: 12px; padding-top: 11px; border-top: 1px solid var(--divider); font-size: 13.5px; line-height: 1.65; white-space: pre-wrap; }
    .exp-photo { margin-top: 10px; }
    .exp-photo img { max-width: 260px; width: 100%; border-radius: 6px; border: 1px solid var(--divider); display: block; }

    /* --- 폼 --- */
    .form-card { border: 1px solid var(--divider); border-radius: 8px; padding: 20px; margin-bottom: 22px; background: #fcfcfc; }
    .form-card.recur-form { background: #f0fdf4; border-color: #86efac; }
    .form-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 14px; }
    .field label { display: block; font-size: 13px; font-weight: 600; margin-bottom: 5px; }
    .field input, .field select, .field textarea { width: 100%; padding: 9px 10px; font-size: 14px; border: 1px solid var(--divider); border-radius: 5px; font-family: inherit; background: #fff; color: var(--text-main); }
    .field textarea { resize: vertical; min-height: 74px; line-height: 1.6; }
    .field-hint { font-size: 12px; color: var(--text-gray); margin-top: 4px; }
    .label-row { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
    .cat-picker { display: flex; gap: 6px; flex-wrap: wrap; }
    .cat-opt { border: 1px solid var(--divider); background: #fff; border-radius: 6px; padding: 8px 14px; font-size: 14px; cursor: pointer; font-family: inherit; color: var(--text-main); }
    .cat-opt.active { background: #111827; color: #fff; border-color: #111827; }
    .ad-fields { margin-top: 16px; padding: 16px; background: #eff6ff; border-radius: 6px; border: 1px solid #bfdbfe; }
    .ad-fields-title { font-size: 13px; font-weight: 700; color: #1e40af; margin-bottom: 12px; }
    .form-actions { display: flex; gap: 8px; margin-top: 18px; align-items: center; flex-wrap: wrap; }
    .amt-row { display: flex; gap: 6px; }
    .amt-row select { width: 74px; flex-shrink: 0; }
    .photo-row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
    .photo-name { font-size: 13px; color: var(--text-gray); }
    .status-msg { font-size: 14px; font-weight: 600; }
    .form-head { font-size: 15px; font-weight: 700; margin-bottom: 14px; }

    /* --- 결제수단 관리 --- */
    .pay-manage { margin-top: 8px; padding: 12px 14px; background: #fff; border: 1px solid var(--divider); border-radius: 6px; }
    .pay-manage-title { font-size: 12.5px; font-weight: 700; margin-bottom: 9px; color: var(--text-gray); }
    .pay-mrow { display: flex; align-items: center; gap: 8px; padding: 5px 0; font-size: 14px; }
    .pay-mname { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .pay-mrow input { flex: 1; padding: 6px 8px; font-size: 13.5px; border: 1px solid var(--divider); border-radius: 4px; font-family: inherit; }
    .icon-btn { background: none; border: none; cursor: pointer; font-size: 13px; padding: 2px 4px; border-radius: 4px; color: var(--text-gray); font-family: inherit; }
    .icon-btn:hover { background: var(--bg-hover); }
    .pay-add { display: flex; gap: 6px; margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--divider); }
    .pay-add input { flex: 1; padding: 7px 9px; font-size: 13.5px; border: 1px solid var(--divider); border-radius: 4px; font-family: inherit; }

    /* --- 좁은 화면 --- */
    @media (max-width: 640px) {
      .exp-container { padding: 16px; }
      .hero-num { font-size: 32px; }
      .cat-name { width: 72px; font-size: 13px; }
      .cat-amt { min-width: 78px; font-size: 13px; }
      .exp-head { flex-wrap: wrap; row-gap: 4px; }
      .exp-title { flex: 1 1 calc(100% - 32px); order: 1; }
      .more-btn { order: 2; }
      .recur-mark { order: 3; }
      .badge { order: 4; }
      .exp-amt { order: 5; margin-left: auto; }
      .recur-item { row-gap: 4px; }
      .recur-amt { margin-left: 0; }
    }
  </style>
</head>
<body>

  <header>
    <div class="header-container">
      <a href="index.html" class="logo">📦 Parcel beside U (Admin)</a>
      <button class="hamburger">☰</button>
      <nav class="nav-links">
        <a href="admin.html">← Dashboard</a>
      </nav>
    </div>
  </header>

  <main>
    <h1 class="page-title">💸 지출 관리</h1>

    <!-- 로그인 -->
    <div id="login-section" class="exp-container">
      <h2>Please Login</h2>
      <form id="login-form" onsubmit="return handleLogin(event)">
        <div class="login-field">
          <label>Email</label>
          <input type="email" id="admin-email" placeholder="admin@example.com" required />
        </div>
        <div class="login-field">
          <label>Password</label>
          <input type="password" id="admin-password" placeholder="••••••••" required />
        </div>
        <button type="submit" class="btn-primary">Login</button>
      </form>
      <p id="login-error" style="color: red; margin-top: 12px; font-weight: bold;"></p>
    </div>

    <!-- 본문 -->
    <div id="main-section" class="exp-container hidden">

      <div class="exp-toolbar">
        <div class="month-nav">
          <button type="button" id="prev-month" aria-label="이전 달">‹</button>
          <span class="month-label" id="month-label">—</span>
          <button type="button" id="next-month" aria-label="다음 달">›</button>
        </div>
        <button class="btn-primary" type="button" id="toggle-form">+ 지출 추가</button>
      </div>

      <!-- 지출 입력 폼 -->
      <div class="form-card hidden" id="form-card">
        <div class="form-head hidden" id="form-title"></div>

        <div class="field" style="margin-bottom:14px;">
          <label>분류</label>
          <div class="cat-picker" id="cat-picker">
            <button type="button" class="cat-opt active" data-cat="광고비">📣 광고비</button>
            <button type="button" class="cat-opt" data-cat="인쇄물">🖨️ 인쇄물</button>
            <button type="button" class="cat-opt" data-cat="사무실 비품">🏢 사무실 비품</button>
            <button type="button" class="cat-opt" data-cat="고정비">🏠 고정비</button>
            <button type="button" class="cat-opt" data-cat="기타">📎 기타</button>
          </div>
        </div>

        <div class="form-grid">
          <div class="field">
            <label for="f-date">날짜</label>
            <input type="date" id="f-date" />
          </div>
          <div class="field">
            <label for="f-amount">금액</label>
            <div class="amt-row">
              <select id="f-currency" aria-label="통화">
                <option value="KRW">₩</option>
                <option value="USD">$</option>
              </select>
              <input type="number" id="f-amount" step="0.01" min="0" placeholder="150000" />
            </div>
          </div>
          <div class="field hidden" id="fx-field">
            <label for="f-fx">환율 (1달러당 원)</label>
            <input type="number" id="f-fx" step="0.01" min="0" placeholder="1380" />
            <div class="field-hint" id="fx-hint">원화로 환산해 합계에 반영됩니다</div>
          </div>
          <div class="field">
            <div class="label-row">
              <label for="f-pay" style="margin:0;">결제수단</label>
              <button type="button" class="link-btn" id="pay-manage-toggle">관리</button>
            </div>
            <select id="f-pay" style="margin-top:5px;"></select>
            <div class="pay-manage hidden" id="pay-manage">
              <div class="pay-manage-title">결제수단 관리 — 이름을 바꾸거나 목록에서 지울 수 있어요</div>
              <div id="pay-mlist"></div>
              <div class="pay-add">
                <input type="text" id="pay-new" placeholder="새 결제수단 (예: 국민카드)" />
                <button type="button" class="btn-ghost btn-sm" id="pay-add-btn">추가</button>
              </div>
              <p class="status-msg" id="pay-status" style="margin:8px 0 0;font-size:12.5px;"></p>
            </div>
          </div>
          <div class="field">
            <label for="f-vendor">지출처</label>
            <input type="text" id="f-vendor" placeholder="예: Meta, 인쇄나라" />
          </div>
        </div>

        <div class="field" style="margin-top:14px;">
          <label for="f-memo">메모</label>
          <input type="text" id="f-memo" placeholder="간단한 설명 (선택)" />
        </div>

        <div class="field" style="margin-top:14px;">
          <label>사진 첨부 <span style="font-weight:400;color:var(--text-gray);">(선택)</span></label>
          <div class="photo-row">
            <input type="file" id="f-photo-file" accept="image/*" class="hidden" />
            <button type="button" class="btn-ghost btn-sm" id="photo-pick-btn">사진 선택</button>
            <span class="photo-name" id="photo-name">선택된 파일 없음</span>
            <button type="button" class="link-btn danger hidden" id="photo-clear-btn">제거</button>
          </div>
          <div class="field-hint">관리자만 볼 수 있는 비공개 저장소에 보관됩니다</div>
        </div>

        <!-- 광고비 전용 -->
        <div class="ad-fields" id="ad-fields">
          <div class="ad-fields-title">📣 광고 상세 — 나중에 성과를 비교하려면 채워두세요</div>
          <div class="form-grid">
            <div class="field">
              <label for="f-platform">플랫폼</label>
              <select id="f-platform">
                <option>Instagram</option><option>Facebook</option><option>Naver</option>
                <option>Kakao</option><option>Google</option><option>기타</option>
              </select>
            </div>
            <div class="field"><label for="f-age">타겟 연령</label><input type="text" id="f-age" placeholder="예: 20-35" /></div>
            <div class="field">
              <label for="f-gender">타겟 성별</label>
              <select id="f-gender"><option>전체</option><option>남성</option><option>여성</option></select>
            </div>
            <div class="field"><label for="f-radius">타겟 반경 (km)</label><input type="number" id="f-radius" step="0.1" min="0" placeholder="예: 10" /></div>
            <div class="field"><label for="f-period">집행 기간</label><input type="text" id="f-period" placeholder="예: 8/1 ~ 8/7" /></div>
          </div>
          <div class="field" style="margin-top:14px;">
            <label for="f-adnote">광고 코멘트 — 타겟 설정 이유, 소재, 결과 등</label>
            <textarea id="f-adnote" placeholder="예) 험프리스 반경 10km, 영어 사용자 대상. 워킹게이트 도보 5분 강조한 이미지 사용. 문의 전화가 늘었음 — 다음엔 예산 늘려서 재집행 예정"></textarea>
          </div>
        </div>

        <div class="form-actions">
          <button class="btn-primary" type="button" id="save-btn">저장</button>
          <button class="btn-ghost" type="button" id="cancel-btn">취소</button>
          <span class="status-msg" id="form-status"></span>
        </div>
      </div>

      <!-- 요약 -->
      <div class="hero">
        <div class="hero-label" id="hero-label">이번 달 지출</div>
        <div class="hero-num" id="hero-num">—</div>
        <div class="hero-delta" id="hero-delta"></div>
      </div>

      <div class="two-col">
        <div>
          <p class="sec-title">분류별 지출</p>
          <div id="cat-bars"></div>
        </div>
        <div>
          <p class="sec-title">결제수단별 지출</p>
          <div id="pay-bars"></div>
        </div>
      </div>

      <p class="sec-title">최근 6개월 추이</p>
      <div class="trend" id="trend"></div>
      <div class="trend-x" id="trend-x"></div>

      <!-- 정기결제 -->
      <p class="sec-title">🔁 정기결제</p>
      <div id="recur-alert-host"></div>
      <div id="recur-list"></div>
      <div style="margin: 10px 0 4px;">
        <button class="btn-ghost btn-sm" type="button" id="toggle-recur-form">+ 정기결제 추가</button>
      </div>

      <div class="form-card recur-form hidden" id="recur-form">
        <div class="form-head" id="recur-form-title">🔁 정기결제 등록</div>
        <div class="form-grid">
          <div class="field"><label for="r-name">항목 이름</label><input type="text" id="r-name" placeholder="예: 인터넷 (KT)" /></div>
          <div class="field">
            <label for="r-amount">금액</label>
            <div class="amt-row">
              <select id="r-currency" aria-label="통화"><option value="KRW">₩</option><option value="USD">$</option></select>
              <input type="number" id="r-amount" step="0.01" min="0" placeholder="39600" />
            </div>
          </div>
          <div class="field">
            <label for="r-day">결제일</label>
            <select id="r-day"></select>
          </div>
          <div class="field">
            <label for="r-pay">결제수단</label>
            <select id="r-pay"></select>
          </div>
        </div>
        <div class="field" style="margin-top:14px;">
          <label>분류</label>
          <div class="cat-picker" id="r-cat-picker">
            <button type="button" class="cat-opt" data-cat="광고비">📣 광고비</button>
            <button type="button" class="cat-opt" data-cat="인쇄물">🖨️ 인쇄물</button>
            <button type="button" class="cat-opt" data-cat="사무실 비품">🏢 사무실 비품</button>
            <button type="button" class="cat-opt active" data-cat="고정비">🏠 고정비</button>
            <button type="button" class="cat-opt" data-cat="기타">📎 기타</button>
          </div>
        </div>
        <div class="field" style="margin-top:14px;">
          <label for="r-memo">메모</label>
          <input type="text" id="r-memo" placeholder="등록할 때 함께 기록됩니다 (선택)" />
        </div>
        <div class="form-actions">
          <button class="btn-primary" type="button" id="recur-save">저장</button>
          <button class="btn-ghost" type="button" id="recur-cancel">취소</button>
          <span class="status-msg" id="recur-status"></span>
        </div>
      </div>

      <!-- 지출 내역 -->
      <p class="sec-title">지출 내역 <span style="font-weight:400;color:var(--text-gray);" id="list-count"></span></p>
      <div class="filter-chips" id="filter-chips">
        <button type="button" class="chip active" data-f="all">전체</button>
        <button type="button" class="chip" data-f="광고비">광고비</button>
        <button type="button" class="chip" data-f="인쇄물">인쇄물</button>
        <button type="button" class="chip" data-f="사무실 비품">사무실 비품</button>
        <button type="button" class="chip" data-f="고정비">고정비</button>
        <button type="button" class="chip" data-f="기타">기타</button>
        <button type="button" class="chip" data-f="정기">🔁 정기결제만</button>
      </div>
      <div id="exp-list"><p style="color:var(--text-gray);font-size:14px;">불러오는 중...</p></div>

    </div>
  </main>

  <script>
    // =========================================================
    // 지출 관리 — 전체 로직
    // =========================================================
    const SUPABASE_URL = 'https://ankpcatdvcumwdjwptvp.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImFua3BjYXRkdmN1bXdkandwdHZwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzYyODUwNjgsImV4cCI6MjA5MTg2MTA2OH0.lFN2Lov4Wp6gWLeXIIpcViz8Yv-V5i-iR0sLyJiAros';
    const PHOTO_BUCKET = 'expense-photos';

    var db = null;
    function getDb() {
      if (!db && window.supabase) db = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
      return db;
    }

    var BADGE = { '광고비': 'b-ad', '인쇄물': 'b-print', '사무실 비품': 'b-office', '고정비': 'b-fixed', '기타': 'b-etc' };
    var CATCOLOR = { '광고비': '#3b82f6', '인쇄물': '#8b5cf6', '사무실 비품': '#f59e0b', '고정비': '#10b981', '기타': '#9ca3af' };
    // 결제수단 색: 목록 순서(=정체성)에 따라 고정 배정. 금액 순위에 따라 바뀌지 않는다.
    var PAY_PALETTE = ['#3b82f6', '#8b5cf6', '#f59e0b', '#10b981', '#ec4899', '#06b6d4', '#84cc16', '#6b7280'];

    var allRows = [];       // 지출 전체
    var payMethods = [];    // [{id, name, sort_order}]
    var recurItems = [];    // [{id, name, amount, ...}]
    var viewMonth = new Date(); viewMonth.setDate(1);
    var activeFilter = 'all';
    var editingId = null;
    var linkRecurringId = null;   // 정기결제에서 등록 시 연결할 id
    var pendingPhotoFile = null;
    var pendingPhotoRemove = false;
    var editingRecurId = null;

    // ---------- 유틸 ----------
    function won(n) { return '₩' + Math.round(n).toLocaleString('ko-KR'); }
    function usd(n) { return '$' + Number(n).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 }); }
    function pad2(n) { return String(n).padStart(2, '0'); }
    function monthKey(d) { return d.getFullYear() + '-' + pad2(d.getMonth() + 1); }
    function monthOf(s) { return s.slice(0, 7); }
    function monthLabel(d) { return d.getFullYear() + '년 ' + (d.getMonth() + 1) + '월'; }
    function dateStr(d) { return d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate()); }
    function todayStr() { return dateStr(new Date()); }
    function esc(s) {
      return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;')
        .replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;');
    }
    function dayLabel(d) { return d === 99 ? '매월 말일' : '매월 ' + d + '일'; }

    // 정기결제의 해당 달 결제일 (말일/짧은 달 자동 보정)
    function recurDate(item, mDate) {
      var y = mDate.getFullYear(), m = mDate.getMonth();
      var last = new Date(y, m + 1, 0).getDate();
      var day = item.day_of_month === 99 ? last : Math.min(item.day_of_month, last);
      return new Date(y, m, day);
    }
    function recurRegistered(item, mDate) {
      var k = monthKey(mDate);
      return allRows.some(function(r) { return r.recurring_id === item.id && monthOf(r.spent_on) === k; });
    }
    // 정기결제를 등록한 달부터만 따진다 (그 전 달까지 "미등록"으로 뜨지 않도록)
    function recurStarted(item, mDate) {
      if (!item.created_at) return true;
      return monthKey(mDate) >= monthOf(item.created_at);
    }
    function recurDue(item, mDate) {
      return recurStarted(item, mDate) && dateStr(recurDate(item, mDate)) <= todayStr();
    }

    // ---------- 로그인 ----------
    window.handleLogin = async function(e) {
      if (e) e.preventDefault();
      var err = document.getElementById('login-error');
      var client = getDb();
      if (!client) { err.innerText = '인터넷 접속 문제로 라이브러리가 로드되지 않았습니다.'; return false; }
      err.style.color = '#eab308'; err.innerText = '로그인 중입니다...';
      try {
        var res = await client.auth.signInWithPassword({
          email: document.getElementById('admin-email').value,
          password: document.getElementById('admin-password').value
        });
        if (res.error) { err.style.color = 'red'; err.innerText = '로그인 실패: ' + res.error.message; }
        else { err.innerText = ''; showMain(); }
      } catch (ex) { err.style.color = 'red'; err.innerText = '오류 발생: ' + ex.message; }
      return false;
    };

    function showMain() {
      document.getElementById('login-section').classList.add('hidden');
      document.getElementById('main-section').classList.remove('hidden');
      loadAll();
    }

    // ---------- 데이터 로드 ----------
    async function loadAll() {
      var client = getDb();
      try {
        var rows = [];
        for (var from = 0; from < 20000; from += 1000) {
          var res = await client.from('expenses').select('*')
            .order('spent_on', { ascending: false }).order('id', { ascending: false })
            .range(from, from + 999);
          if (res.error) throw res.error;
          rows = rows.concat(res.data || []);
          if (!res.data || res.data.length < 1000) break;
        }
        allRows = rows;

        var pm = await client.from('payment_methods').select('*').order('sort_order').order('id');
        if (pm.error) throw pm.error;
        payMethods = pm.data || [];

        var rc = await client.from('recurring_expenses').select('*').order('day_of_month').order('id');
        if (rc.error) throw rc.error;
        recurItems = rc.data || [];

        syncPaySelects();
        renderPayManage();
        renderAll();
      } catch (err) {
        document.getElementById('exp-list').innerHTML =
          '<p style="color:#b91c1c;font-size:14px;">불러오지 못했습니다: ' + esc(err.message)
          + '<br />필요한 테이블이 없다면 Supabase SQL(2026-08-13-expenses-v2.sql)을 먼저 실행해주세요.</p>';
      }
    }

    // ---------- 렌더 ----------
    function renderAll() {
      document.getElementById('month-label').innerText = monthLabel(viewMonth);
      renderHero(); renderCats(); renderPays(); renderTrend(); renderRecur(); renderList();
    }
    function rowsOfMonth(d) {
      var k = monthKey(d);
      return allRows.filter(function(r) { return monthOf(r.spent_on) === k; });
    }
    function sumKrw(rows) { return rows.reduce(function(s, r) { return s + Number(r.amount_krw || 0); }, 0); }

    function renderHero() {
      var cur = rowsOfMonth(viewMonth);
      var pd = new Date(viewMonth); pd.setMonth(pd.getMonth() - 1);
      var total = sumKrw(cur), prevTotal = sumKrw(rowsOfMonth(pd));
      document.getElementById('hero-label').innerText = monthLabel(viewMonth) + ' 지출';
      document.getElementById('hero-num').innerText = won(total);
      var el = document.getElementById('hero-delta');
      if (prevTotal === 0) {
        el.className = 'hero-delta delta-flat';
        el.innerText = cur.length ? '지난달 지출 기록이 없어 비교할 수 없어요' : '이번 달 지출 기록이 없습니다';
        return;
      }
      var diff = total - prevTotal, pct = Math.round(Math.abs(diff) / prevTotal * 100);
      if (diff > 0) { el.className = 'hero-delta delta-up'; el.innerText = '▲ 지난달보다 ' + won(diff) + ' 늘었어요 (+' + pct + '%)'; }
      else if (diff < 0) { el.className = 'hero-delta delta-down'; el.innerText = '▼ 지난달보다 ' + won(-diff) + ' 줄었어요 (-' + pct + '%)'; }
      else { el.className = 'hero-delta delta-flat'; el.innerText = '지난달과 같습니다'; }
    }

    function drawBars(hostId, entries, colorFor) {
      var host = document.getElementById(hostId);
      host.innerHTML = '';
      if (!entries.length) { host.innerHTML = '<p style="color:var(--text-gray);font-size:14px;">기록이 없습니다.</p>'; return; }
      var max = entries[0][1] || 1;
      entries.forEach(function(p) {
        var row = document.createElement('div');
        row.className = 'cat-row';
        row.title = p[0] + ' · ' + won(p[1]);
        row.innerHTML =
          '<span class="cat-name">' + esc(p[0]) + '</span>' +
          '<span class="cat-track"><span class="cat-fill" style="width:' + Math.max(3, Math.round(p[1] / max * 100)) + '%;background:' + colorFor(p[0]) + '"></span></span>' +
          '<span class="cat-amt">' + won(p[1]) + '</span>';
        host.appendChild(row);
      });
    }

    function renderCats() {
      var by = {};
      rowsOfMonth(viewMonth).forEach(function(r) { by[r.category] = (by[r.category] || 0) + Number(r.amount_krw || 0); });
      var entries = Object.keys(by).map(function(k) { return [k, by[k]]; }).sort(function(a, b) { return b[1] - a[1]; });
      drawBars('cat-bars', entries, function(k) { return CATCOLOR[k] || '#9ca3af'; });
    }

    function renderPays() {
      var by = {};
      rowsOfMonth(viewMonth).forEach(function(r) {
        var k = r.payment_method || '(미지정)';
        by[k] = (by[k] || 0) + Number(r.amount_krw || 0);
      });
      var entries = Object.keys(by).map(function(k) { return [k, by[k]]; }).sort(function(a, b) { return b[1] - a[1]; });
      drawBars('pay-bars', entries, function(name) {
        var i = payMethods.findIndex(function(p) { return p.name === name; });
        return i >= 0 && i < PAY_PALETTE.length ? PAY_PALETTE[i] : '#9ca3af';
      });
    }

    function renderTrend() {
      var host = document.getElementById('trend'), xs = document.getElementById('trend-x');
      host.innerHTML = ''; xs.innerHTML = '';
      var months = [];
      for (var i = 5; i >= 0; i--) {
        var d = new Date(viewMonth); d.setMonth(d.getMonth() - i);
        months.push({ d: d, v: sumKrw(rowsOfMonth(d)) });
      }
      var max = Math.max.apply(null, months.map(function(m) { return m.v; })) || 1;
      months.forEach(function(m, i) {
        var col = document.createElement('div'); col.className = 'trend-col';
        var bar = document.createElement('div');
        bar.className = 'trend-bar' + (i === 5 ? ' current' : '') + (m.v === 0 ? ' empty' : '');
        bar.style.height = m.v === 0 ? '3px' : Math.max(4, Math.round(m.v / max * 100)) + '%';
        bar.title = monthLabel(m.d) + ' · ' + won(m.v);
        col.appendChild(bar); host.appendChild(col);
        var s = document.createElement('span'); s.innerText = (m.d.getMonth() + 1) + '월'; xs.appendChild(s);
      });
    }

    // ---------- 정기결제 ----------
    function dueUnregistered() {
      return recurItems.filter(function(it) {
        return it.active && recurDue(it, viewMonth) && !recurRegistered(it, viewMonth);
      });
    }

    function renderRecur() {
      var alertHost = document.getElementById('recur-alert-host');
      alertHost.innerHTML = '';
      var due = dueUnregistered();
      if (due.length) {
        var box = document.createElement('div');
        box.className = 'recur-alert';
        box.innerHTML = '<div class="recur-alert-text"><b>' + monthLabel(viewMonth)
          + ' 아직 등록하지 않은 정기결제가 ' + due.length + '건 있어요</b>결제일이 지난 항목입니다. 확인하고 등록하면 지출 내역에 추가됩니다.</div>';
        var btn = document.createElement('button');
        btn.className = 'btn-primary btn-sm'; btn.type = 'button';
        btn.innerText = due.length + '건 모두 등록';
        btn.addEventListener('click', function() { registerAllDue(due); });
        box.appendChild(btn);
        alertHost.appendChild(box);
      }

      var host = document.getElementById('recur-list');
      host.innerHTML = '';
      if (!recurItems.length) {
        host.innerHTML = '<p style="color:var(--text-gray);font-size:14px;">등록된 정기결제가 없습니다. 매달 같은 날 나가는 비용(월세·인터넷·통신비 등)을 추가해보세요.</p>';
        return;
      }
      recurItems.forEach(function(it) {
        var item = document.createElement('div');
        item.className = 'recur-item' + (it.active ? '' : ' off');
        var done = recurRegistered(it, viewMonth);
        var state = !it.active ? '<span class="recur-state state-off">해지됨</span>'
          : done ? '<span class="recur-state state-done">' + (viewMonth.getMonth() + 1) + '월 등록됨 ✓</span>'
          : !recurStarted(it, viewMonth) ? '<span class="recur-state state-off">등록 전</span>'
          : recurDue(it, viewMonth) ? '<span class="recur-state state-todo">' + (viewMonth.getMonth() + 1) + '월 미등록</span>'
          : '<span class="recur-state state-off">결제일 전</span>';
        var amt = it.currency === 'USD' ? usd(it.amount) : won(it.amount);
        item.innerHTML =
          '<span class="recur-day">' + dayLabel(it.day_of_month) + '</span>' +
          '<span><span class="recur-name">' + esc(it.name) + '</span>' +
          '<span class="recur-meta">' + esc(it.category) + (it.payment_method ? ' · ' + esc(it.payment_method) : '') + '</span></span>' +
          '<span class="recur-amt">' + amt + '</span>' + state;

        if (it.active && !done && recurDue(it, viewMonth)) {
          var reg = document.createElement('button');
          reg.className = 'btn-primary btn-sm'; reg.type = 'button'; reg.innerText = '등록';
          reg.addEventListener('click', function() { startRegisterRecurring(it); });
          item.appendChild(reg);
        }
        var more = document.createElement('button');
        more.className = 'icon-btn'; more.type = 'button'; more.innerText = '⋯'; more.title = '수정 / 해지 / 삭제';
        more.addEventListener('click', function() { recurMenu(it); });
        item.appendChild(more);
        host.appendChild(item);
      });
    }

    function recurMenu(it) {
      var msg = '"' + it.name + '"\n\n1 = 수정\n2 = ' + (it.active ? '해지(목록에 남기고 알림만 중지)' : '다시 사용')
        + '\n3 = 완전 삭제\n\n번호를 입력하세요 (취소는 빈칸)';
      var pick = prompt(msg, '');
      if (pick === '1') startEditRecur(it);
      else if (pick === '2') toggleRecurActive(it);
      else if (pick === '3') deleteRecur(it);
    }

    async function toggleRecurActive(it) {
      var res = await getDb().from('recurring_expenses').update({ active: !it.active }).eq('id', it.id);
      if (res.error) { alert('변경 실패: ' + res.error.message); return; }
      await loadAll();
    }
    async function deleteRecur(it) {
      if (!confirm('"' + it.name + '" 정기결제를 완전히 삭제할까요?\n이미 등록된 지출 기록은 그대로 남습니다.')) return;
      var res = await getDb().from('recurring_expenses').delete().eq('id', it.id);
      if (res.error) { alert('삭제 실패: ' + res.error.message); return; }
      await loadAll();
    }

    // 개별 등록 → 지출 폼에 채워서 확인 후 저장
    function startRegisterRecurring(it) {
      resetForm();
      linkRecurringId = it.id;
      setCategory(it.category);
      document.getElementById('f-date').value = dateStr(recurDate(it, viewMonth));
      document.getElementById('f-currency').value = it.currency || 'KRW';
      document.getElementById('f-amount').value = it.amount;
      document.getElementById('f-vendor').value = it.name;
      document.getElementById('f-memo').value = it.memo || '';
      if (it.payment_method) document.getElementById('f-pay').value = it.payment_method;
      var t = document.getElementById('form-title');
      t.innerText = '🔁 ' + it.name + ' — ' + monthLabel(viewMonth) + ' 등록 (금액이 달라졌다면 수정하세요)';
      t.classList.remove('hidden');
      syncCurrencyUI();
      openForm();
      document.getElementById('form-card').scrollIntoView({ behavior: 'smooth', block: 'start' });
    }

    // 일괄 등록
    async function registerAllDue(due) {
      var fx = parseFloat(localStorage.getItem('pbu_last_fx') || '0');
      var usable = [], skipped = [];
      due.forEach(function(it) {
        if (it.currency === 'USD' && !(fx > 0)) skipped.push(it.name);
        else usable.push(it);
      });
      if (!usable.length) {
        alert('달러 정기결제는 환율이 필요합니다.\n항목별 [등록] 버튼으로 환율을 입력해 등록해주세요.');
        return;
      }
      var lines = usable.map(function(it) {
        var krw = it.currency === 'USD' ? Math.round(it.amount * fx) : Number(it.amount);
        return '· ' + it.name + '  ' + won(krw) + (it.currency === 'USD' ? ' (환율 ' + fx.toLocaleString('ko-KR') + ')' : '');
      });
      var total = usable.reduce(function(s, it) {
        return s + (it.currency === 'USD' ? Math.round(it.amount * fx) : Number(it.amount));
      }, 0);
      var msg = monthLabel(viewMonth) + ' 지출로 아래 ' + usable.length + '건을 등록할까요?\n\n' + lines.join('\n')
        + '\n\n합계 ' + won(total)
        + (skipped.length ? '\n\n※ 환율 정보가 없어 제외됨: ' + skipped.join(', ') : '');
      if (!confirm(msg)) return;

      var payload = usable.map(function(it) {
        return {
          spent_on: dateStr(recurDate(it, viewMonth)),
          category: it.category,
          amount: Number(it.amount),
          currency: it.currency || 'KRW',
          exchange_rate: it.currency === 'USD' ? fx : null,
          amount_krw: it.currency === 'USD' ? Math.round(it.amount * fx) : Number(it.amount),
          vendor: it.name,
          memo: it.memo || null,
          payment_method: it.payment_method || null,
          recurring_id: it.id
        };
      });
      var res = await getDb().from('expenses').insert(payload);
      if (res.error) { alert('등록 실패: ' + res.error.message); return; }
      await loadAll();
    }

    // 정기결제 추가/수정 폼
    function openRecurForm() {
      document.getElementById('recur-form').classList.remove('hidden');
      document.getElementById('toggle-recur-form').innerText = '✕ 닫기';
    }
    function closeRecurForm() {
      document.getElementById('recur-form').classList.add('hidden');
      document.getElementById('toggle-recur-form').innerText = '+ 정기결제 추가';
    }
    function resetRecurForm() {
      editingRecurId = null;
      document.getElementById('recur-form-title').innerText = '🔁 정기결제 등록';
      document.getElementById('r-name').value = '';
      document.getElementById('r-currency').value = 'KRW';
      document.getElementById('r-amount').value = '';
      document.getElementById('r-day').value = '1';
      document.getElementById('r-memo').value = '';
      document.getElementById('recur-status').innerText = '';
      setRecurCategory('고정비');
      if (payMethods.length) document.getElementById('r-pay').value = payMethods[0].name;
    }
    function startEditRecur(it) {
      resetRecurForm();
      editingRecurId = it.id;
      document.getElementById('recur-form-title').innerText = '🔁 정기결제 수정';
      document.getElementById('r-name').value = it.name;
      document.getElementById('r-currency').value = it.currency || 'KRW';
      document.getElementById('r-amount').value = it.amount;
      document.getElementById('r-day').value = String(it.day_of_month);
      document.getElementById('r-memo').value = it.memo || '';
      setRecurCategory(it.category);
      if (it.payment_method) document.getElementById('r-pay').value = it.payment_method;

    // ---------- 결제수단 ----------
    function syncPaySelects() {
      ['f-pay', 'r-pay'].forEach(function(id) {
        var sel = document.getElementById(id);
        var cur = sel.value;
        sel.innerHTML = '';
        payMethods.forEach(function(p) {
          var o = document.createElement('option');
          o.value = p.name; o.textContent = p.name;
          sel.appendChild(o);
        });
        if (cur && payMethods.some(function(p) { return p.name === cur; })) sel.value = cur;
      });
    }

    function renderPayManage() {
      var host = document.getElementById('pay-mlist');
      host.innerHTML = '';
      payMethods.forEach(function(p) {
        var row = document.createElement('div');
        row.className = 'pay-mrow';
        var label = document.createElement('span');
        label.className = 'pay-mname'; label.innerText = p.name;
        var edit = document.createElement('button');
        edit.className = 'icon-btn'; edit.type = 'button'; edit.innerText = '✏️'; edit.title = '이름 바꾸기';
        var del = document.createElement('button');
        del.className = 'icon-btn'; del.type = 'button'; del.innerText = '🗑'; del.title = '목록에서 삭제';

        edit.addEventListener('click', function() {
          row.innerHTML = '';
          var input = document.createElement('input');
          input.type = 'text'; input.value = p.name;
          var ok = document.createElement('button');
          ok.className = 'icon-btn'; ok.type = 'button'; ok.innerText = '✔'; ok.title = '저장';
          var no = document.createElement('button');
          no.className = 'icon-btn'; no.type = 'button'; no.innerText = '✕'; no.title = '취소';
          ok.addEventListener('click', function() { renamePayMethod(p, input.value.trim()); });
          no.addEventListener('click', renderPayManage);
          input.addEventListener('keydown', function(e) { if (e.key === 'Enter') renamePayMethod(p, input.value.trim()); });
          row.appendChild(input); row.appendChild(ok); row.appendChild(no);
          input.focus();
        });
        del.addEventListener('click', function() { deletePayMethod(p); });

        row.appendChild(label); row.appendChild(edit); row.appendChild(del);
        host.appendChild(row);
      });

    async function addPayMethod() {
      var input = document.getElementById('pay-new');
      var st = document.getElementById('pay-status');
      var name = input.value.trim();
      if (!name) return;
      if (payMethods.some(function(p) { return p.name === name; })) {
        st.style.color = '#b91c1c'; st.innerText = '이미 있는 결제수단입니다.'; return;
      }
      st.style.color = '#eab308'; st.innerText = '추가 중...';
      var maxOrder = payMethods.reduce(function(m, p) { return Math.max(m, p.sort_order || 0); }, 0);
      var res = await getDb().from('payment_methods').insert({ name: name, sort_order: maxOrder + 1 });
      if (res.error) { st.style.color = '#b91c1c'; st.innerText = '추가 실패: ' + res.error.message; return; }
      input.value = ''; st.innerText = '';
      await reloadPayMethods();
    }

    async function renamePayMethod(p, newName) {
      var st = document.getElementById('pay-status');
      if (!newName || newName === p.name) { renderPayManage(); return; }
      if (payMethods.some(function(x) { return x.name === newName; })) {
        st.style.color = '#b91c1c'; st.innerText = '이미 있는 이름입니다.'; renderPayManage(); return;
      }
      st.style.color = '#eab308'; st.innerText = '이름 바꾸는 중...';
      var client = getDb();
      var r1 = await client.from('payment_methods').update({ name: newName }).eq('id', p.id);
      if (r1.error) { st.style.color = '#b91c1c'; st.innerText = '변경 실패: ' + r1.error.message; return; }
      // 기존 기록의 결제수단 이름도 함께 바꿔서 집계가 흩어지지 않게 한다
      await client.from('expenses').update({ payment_method: newName }).eq('payment_method', p.name);
      await client.from('recurring_expenses').update({ payment_method: newName }).eq('payment_method', p.name);
      st.innerText = '';
      await loadAll();
    }

    async function deletePayMethod(p) {
      var used = allRows.filter(function(r) { return r.payment_method === p.name; }).length;
      var msg = '"' + p.name + '"을 결제수단 목록에서 지울까요?';
      if (used) msg += '\n\n이미 기록된 지출 ' + used + '건에는 그대로 남습니다(장부는 바뀌지 않습니다).';
      if (!confirm(msg)) return;
      var res = await getDb().from('payment_methods').delete().eq('id', p.id);
      if (res.error) { alert('삭제 실패: ' + res.error.message); return; }
      await reloadPayMethods();
    }

    async function reloadPayMethods() {
      var pm = await getDb().from('payment_methods').select('*').order('sort_order').order('id');
      if (!pm.error) {
        payMethods = pm.data || [];
        syncPaySelects(); renderPayManage(); renderPays();
      }
    }

    // ---------- 지출 폼 ----------

    function startEdit(r) {
      resetForm();
      editingId = r.id;

      setCategory(r.category);
      document.getElementById('f-date').value = r.spent_on;

      if (r.exchange_rate) document.getElementById('f-fx').value = r.exchange_rate;
      document.getElementById('f-vendor').value = r.vendor || '';

      if (r.payment_method && payMethods.some(function(p) { return p.name === r.payment_method; })) {
        document.getElementById('f-pay').value = r.payment_method;
      }
      if (r.ad_platform) document.getElementById('f-platform').value = r.ad_platform;

      if (r.ad_target_gender) document.getElementById('f-gender').value = r.ad_target_gender;
      document.getElementById('f-radius').value = r.ad_radius_km || '';
      document.getElementById('f-period').value = r.ad_period || '';

    async function saveExpense() {
      var status = document.getElementById('form-status');
      var btn = document.getElementById('save-btn');
      var client = getDb();

      var category = selectedCategory();
      var spentOn = document.getElementById('f-date').value;
      var currency = document.getElementById('f-currency').value;
      var amount = parseFloat(document.getElementById('f-amount').value);
      var fx = parseFloat(document.getElementById('f-fx').value);

      if (!spentOn) { status.style.color = '#b91c1c'; status.innerText = '날짜를 입력해주세요.'; return; }
      if (!(amount > 0)) { status.style.color = '#b91c1c'; status.innerText = '금액을 입력해주세요.'; return; }
      if (currency === 'USD' && !(fx > 0)) { status.style.color = '#b91c1c'; status.innerText = '달러 지출은 환율을 입력해주세요.'; return; }

      btn.disabled = true;
      status.style.color = '#eab308'; status.innerText = '저장 중...';

      try {
        var existing = editingId ? allRows.find(function(x) { return x.id === editingId; }) : null;
        var photoPath = existing ? existing.photo_path : null;

        if (pendingPhotoFile) {
          status.innerText = '사진 업로드 중...';
          var ext = (pendingPhotoFile.name.split('.').pop() || 'jpg').toLowerCase();
          var newPath = 'expenses/' + Date.now() + '-' + Math.random().toString(36).slice(2, 8) + '.' + ext;
          var up = await client.storage.from(PHOTO_BUCKET).upload(newPath, pendingPhotoFile, { cacheControl: '3600', upsert: false });
          if (up.error) throw new Error('사진 업로드 실패: ' + up.error.message);
          if (photoPath) await client.storage.from(PHOTO_BUCKET).remove([photoPath]);
          photoPath = newPath;
        } else if (pendingPhotoRemove && photoPath) {
          await client.storage.from(PHOTO_BUCKET).remove([photoPath]);
          photoPath = null;
        }

        var isAd = category === '광고비';
        var payload = {
          spent_on: spentOn,
          category: category,
          amount: amount,
          currency: currency,
          exchange_rate: currency === 'USD' ? fx : null,
          amount_krw: currency === 'USD' ? Math.round(amount * fx) : amount,
          vendor: document.getElementById('f-vendor').value.trim() || null,
          memo: document.getElementById('f-memo').value.trim() || null,
          payment_method: document.getElementById('f-pay').value || null,
          photo_path: photoPath,
          recurring_id: linkRecurringId,
          ad_platform: isAd ? document.getElementById('f-platform').value : null,
          ad_target_age: isAd ? (document.getElementById('f-age').value.trim() || null) : null,
          ad_target_gender: isAd ? document.getElementById('f-gender').value : null,
          ad_radius_km: isAd ? (parseFloat(document.getElementById('f-radius').value) || null) : null,
          ad_period: isAd ? (document.getElementById('f-period').value.trim() || null) : null,
          ad_note: isAd ? (document.getElementById('f-adnote').value.trim() || null) : null
        };

        var res = editingId
          ? await client.from('expenses').update(payload).eq('id', editingId)
          : await client.from('expenses').insert(payload);
        if (res.error) throw res.error;

        if (currency === 'USD') localStorage.setItem('pbu_last_fx', String(fx));

        var saved = new Date(spentOn + 'T00:00:00');
        viewMonth = new Date(saved.getFullYear(), saved.getMonth(), 1);

        resetForm(); closeForm();
        await loadAll();
      } catch (err) {
        status.style.color = '#b91c1c';
        status.innerText = '저장 실패: ' + err.message;
      } finally {
        btn.disabled = false;
      }
    }

    async function removeExpense(r) {
      if (!confirm(r.spent_on + ' · ' + (r.vendor || r.category) + ' · ' + won(r.amount_krw)
        + '\n\n이 지출을 삭제할까요? 되돌릴 수 없습니다.')) return;
      var client = getDb();
      try {
        var res = await client.from('expenses').delete().eq('id', r.id);
        if (res.error) throw res.error;
        if (r.photo_path) await client.storage.from(PHOTO_BUCKET).remove([r.photo_path]);
        await loadAll();
      } catch (err) { alert('삭제 실패: ' + err.message); }
    }

    document.getElementById('toggle-recur-form').addEventListener('click', function() {
      var c = document.getElementById('recur-form');
      if (c.classList.contains('hidden')) { resetRecurForm(); openRecurForm(); } else closeRecurForm();
    });
    document.getElementById('recur-cancel').addEventListener('click', function() { resetRecurForm(); closeRecurForm(); });
    document.getElementById('recur-save').addEventListener('click', saveRecur);

    document.getElementById('filter-chips').addEventListener('click', function(ev) {
      var b = ev.target.closest('.chip'); if (!b) return;
      this.querySelectorAll('.chip').forEach(function(x) { x.classList.remove('active'); });
      b.classList.add('active'); activeFilter = b.dataset.f; renderList();
    });
    document.getElementById('prev-month').addEventListener('click', function() {
      viewMonth.setMonth(viewMonth.getMonth() - 1); renderAll();
    });
    document.getElementById('next-month').addEventListener('click', function() {
      viewMonth.setMonth(viewMonth.getMonth() + 1); renderAll();
    });

    var hb = document.querySelector('.hamburger');
    var nl = document.querySelector('.nav-links');
    if (hb && nl) hb.addEventListener('click', function() { nl.classList.toggle('active'); });

    // 결제일 선택지 채우기
    (function() {
      var sel = document.getElementById('r-day');
      for (var i = 1; i <= 31; i++) {
        var o = document.createElement('option');
        o.value = String(i); o.textContent = i + '일';
        sel.appendChild(o);
      }
      var last = document.createElement('option');
      last.value = '99'; last.textContent = '말일';
      sel.appendChild(last);
    })();

    // 이미 로그인되어 있으면 바로 진입
    (async function() {
      var client = getDb();
      resetForm();
      if (!client) return;
      try {
        var r = await client.auth.getSession();
        if (r.data && r.data.session) showMain();
      } catch (e) { console.warn('세션 확인 실패:', e); }
    })();
  </script>
</body>
</html>
